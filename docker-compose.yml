version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: photoapp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoapp-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/photoapp
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, e.g. in a local .env file}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be exactly 32 bytes, set it in a local .env file}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      PARTNER_USERNAME: ${PARTNER_USERNAME:?PARTNER_USERNAME must be set}
      PARTNER_PASSWORD: ${PARTNER_PASSWORD:?PARTNER_PASSWORD must be set}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}

volumes:
  mongo-data:
